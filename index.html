<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>You're Invited!</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #fff4f5;
            color: #5a3d42;
            text-align: center;
        }

        .invitation {
            max-width: 600px;
            margin: 60px auto;
            padding: 50px 25px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #b76e79;
            font-size: 24px;
            letter-spacing: 3px;
        }

        h2 {
            font-size: 42px;
            margin: 20px 0;
        }

        .details {
            font-size: 18px;
            line-height: 1.8;
            margin: 30px 0;
        }

        .rsvp {
            display: inline-block;
            padding: 12px 30px;
            background: #b76e79;
            color: white;
            text-decoration: none;
            border-radius: 30px;
        }

        .rsvp:hover {
            background: #945762;
        }
    </style>
</head>

<body>

    <div class="invitation">

        <h1>YOU'RE INVITED</h1>

        <h2>Alex & Jamie</h2>

        <p>We would love for you to celebrate with us!</p>

        <div class="details">
            📅 Saturday, December 12<br>
            🕕 6:00 PM<br>
            📍 The Garden Venue
        </div>

        <a class="rsvp" href="mailto:you@example.com">
            RSVP
        </a>

    </div>

</body>
</html>
